name: CI

on:
  push:
    branches:
      - main
      - "pkp/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-surface-audit:
    name: Test Surface Audit
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run test surface audit
        run: bash scripts/ci/test-surface-audit.sh --check

  verifier:
    name: Verifier
    runs-on: ubuntu-latest
    needs: test-surface-audit
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Java/Apalache is only needed for higher TLA+ layers (Layer 2+); Layer 1
      # is purely structural (check-structural.py has no java/apalache/tla deps).
      # We skip the Apalache install during bootstrap so this job needs no JVM.
      - name: Bootstrap verifier dependencies
        env:
          VERIFY_SKIP_APALACHE_INSTALL: "1"
        run: ./scripts/verify/verify.sh --bootstrap

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run verifier unit self-tests
        run: .verifier/.venv/bin/python -m unittest discover -s tests/verify/unit -p 'test_*.py'

      - name: Run verifier Bats coverage
        env:
          VENV_DIR: ${{ github.workspace }}/.verifier/.venv
        run: bats tests/verify

      - name: Run formal verification
        run: ./scripts/verify/verify.sh --layers 1 --json

      - name: Upload verifier report artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: formal-verify-report-${{ github.run_id }}
          path: .verifier/reports/last-run.json
          if-no-files-found: warn
          retention-days: 14

  test-scripts:
    name: Test Shell Scripts
    runs-on: macos-14
    needs: test-surface-audit
    steps:
      - uses: actions/checkout@v6

      - name: Install bats
        run: brew install bats-core

      - name: Run dev script tests
        run: bats tests/dev-scripts

      - name: Run release script tests
        run: bats tests/release-scripts

  test-rust:
    name: Test Rust
    runs-on: macos-14
    needs: test-surface-audit
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: ./scripts/ci/select-xcode.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo fmt check
        run: cargo fmt --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings -W dead_code

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        run: cargo machete

      - name: Run Rust tests
        # Test Rust's testable targets without also building exported staticlib/cdylib artifacts.
        # The release artifact path is covered separately by Build Smoke Test.
        run: cargo test --lib --bins --tests

  test-hook:
    name: Test Hook Binary
    runs-on: macos-14
    needs: test-surface-audit
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: ./scripts/ci/select-xcode.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build hud-hook (release)
        run: cargo build -p hud-hook --release

      - name: Install bats
        run: brew install bats-core

      - name: Run hud-hook smoke tests
        run: bats tests/hud-hook/hud-hook-smoke.bats

  runtime-reliability:
    name: Runtime Reliability Gate
    runs-on: macos-15
    needs: test-surface-audit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.3 (Swift 6.2)
        run: ./scripts/ci/select-xcode.sh /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run runtime reliability suite (deterministic gates)
        run: ./scripts/ci/runtime-reliability.sh ci

  ax-automation:
    name: AX Automation (advisory)
    runs-on: macos-15
    needs: test-surface-audit
    # Advisory lane: the AX verifier is inherently flaky (UI automation), so it
    # must not block merges. Split out of the Runtime Reliability Gate so a flaky
    # AX run can no longer shadow the deterministic projection-parity gate under
    # `set -e`. Builds its own release artifacts via prepare_ax_verifier_build.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.3 (Swift 6.2)
        run: ./scripts/ci/select-xcode.sh /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run AX automation verifier (advisory)
        run: ./scripts/ci/runtime-reliability.sh ax

  test-swift:
    name: Test Swift
    runs-on: macos-15
    needs: test-rust
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.3 (Swift 6.2)
        run: ./scripts/ci/select-xcode.sh /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: apps/swift/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install swiftformat (pinned)
        env:
          SWIFTFORMAT_VERSION: "0.61.1"
        run: |
          curl -sL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o /tmp/swiftformat.zip
          unzip -o /tmp/swiftformat.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/swiftformat
          # Drift-proof: fail fast if the downloaded asset is not the pinned
          # version (GitHub has previously re-pointed release URLs to a newer
          # build). Without this assertion CI could silently lint with the wrong
          # SwiftFormat version, masking or introducing formatting drift.
          INSTALLED_VERSION="$(swiftformat --version)"
          echo "swiftformat reported version: ${INSTALLED_VERSION}"
          if [ "${INSTALLED_VERSION}" != "${SWIFTFORMAT_VERSION}" ]; then
            echo "ERROR: expected swiftformat ${SWIFTFORMAT_VERSION} but got ${INSTALLED_VERSION}" >&2
            exit 1
          fi

      - name: SwiftFormat lint
        run: ./scripts/ci/swiftformat-lint.sh

      - name: Build Rust library
        run: cargo build -p capacitor-core --release

      - name: Run Swift tests
        # Broad run skips the six cross-suite-flaky suites, then each is run in
        # isolation (fresh process) to eliminate MainActor/shared-state leakage.
        # Full coverage preserved. See scripts/ci/swift-test.sh for details.
        run: ./scripts/ci/swift-test.sh

  build-smoke-test:
    name: Build Smoke Test
    runs-on: macos-15
    needs: [test-rust, test-swift]
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.3 (Swift 6.2)
        run: ./scripts/ci/select-xcode.sh /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: apps/swift/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Rust library (release)
        run: cargo build -p capacitor-core --release

      - name: Check UniFFI bindings are fresh
        run: ./scripts/ci/check-uniffi-bindings.sh

      - name: Fix dylib install_name
        run: ./scripts/dev/fix-dylib.sh

      - name: Verify dylib install_name
        run: ./scripts/dev/fix-dylib.sh --verify-only

      - name: Build Swift app (release)
        working-directory: apps/swift
        run: swift build -c release

      - name: Verify version sync
        run: |
          if [ ! -f VERSION ]; then
            echo "ERROR: VERSION file not found"
            exit 1
          fi
          VERSION=$(cat VERSION | tr -d '[:space:]')
          CARGO=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          SWIFT=$(grep -o 'return "[0-9][0-9.a-zA-Z-]*"' apps/swift/Sources/Capacitor/App.swift | tail -1 | sed -E 's/return "(.*)"/\1/')
          echo "VERSION=$VERSION  Cargo=$CARGO  Swift=$SWIFT"
          FAIL=0
          [ "$VERSION" != "$CARGO" ] && echo "MISMATCH: VERSION vs Cargo.toml" && FAIL=1
          [ "$VERSION" != "$SWIFT" ] && echo "MISMATCH: VERSION vs App.swift fallback" && FAIL=1
          [ "$FAIL" = "1" ] && exit 1
          echo "All version surfaces in sync"

      - name: Test bump-version.sh (dry run)
        run: |
          # Save current version
          ORIGINAL=$(cat VERSION)

          # Test patch bump
          ./scripts/release/bump-version.sh patch
          NEW=$(cat VERSION)
          echo "Bumped from $ORIGINAL to $NEW"

          # Restore all files modified by bump-version
          git checkout -- VERSION Cargo.toml apps/swift/Sources/Capacitor/App.swift

  test-worker:
    name: Ingest Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: services/ingest-worker
        run: npm ci

      - name: Run tests
        working-directory: services/ingest-worker
        run: npm test

  build-www:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: apps/www
        run: npm ci

      - name: Build
        working-directory: apps/www
        run: npm run build
