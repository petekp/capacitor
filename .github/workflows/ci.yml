name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-surface-audit:
    name: Test Surface Audit
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run test surface audit
        run: bash scripts/ci/test-surface-audit.sh --check

  verifier-bootstrap:
    name: Verifier Bootstrap
    runs-on: ubuntu-latest
    needs: test-surface-audit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bootstrap verifier dependencies
        run: ./scripts/verify/verify.sh --bootstrap

  verifier-self-test:
    name: Verifier Self-Test
    runs-on: ubuntu-latest
    needs: verifier-bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bootstrap verifier dependencies
        run: ./scripts/verify/verify.sh --bootstrap

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run verifier unit self-tests
        run: .verifier/.venv/bin/python -m unittest discover -s tests/verify/unit -p 'test_*.py'

      - name: Run verifier Bats coverage
        env:
          VENV_DIR: ${{ github.workspace }}/.verifier/.venv
        run: bats tests/verify

  verifier-full:
    name: Verifier Full
    runs-on: ubuntu-latest
    needs: verifier-self-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bootstrap verifier dependencies
        run: ./scripts/verify/verify.sh --bootstrap

      - name: Run formal verification
        run: ./scripts/verify/verify.sh --layers 1 --json

      - name: Upload verifier report artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formal-verify-report-${{ github.run_id }}
          path: .verifier/reports/last-run.json
          if-no-files-found: warn
          retention-days: 14

  test-scripts:
    name: Test Release Scripts
    runs-on: macos-14
    needs: test-surface-audit
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: brew install bats-core

      - name: Run release script tests
        run: bats tests/release-scripts

  test-rust:
    name: Test Rust
    runs-on: macos-14
    needs: test-surface-audit
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo fmt check
        run: cargo fmt --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings -W dead_code

      - name: Install cargo-machete
        run: cargo install cargo-machete

      - name: Check for unused dependencies
        run: cargo machete

      - name: Run cargo test
        run: cargo test

  test-hook:
    name: Test Hook Binary
    runs-on: macos-14
    needs: test-surface-audit
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build hud-hook (release)
        run: cargo build -p hud-hook --release

      - name: Install bats
        run: brew install bats-core

      - name: Run hud-hook smoke tests
        run: bats tests/hud-hook/hud-hook-smoke.bats

  runtime-reliability:
    name: Runtime Reliability Gate
    runs-on: macos-15
    needs: test-surface-audit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3 (Swift 6.2)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          swift --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run runtime reliability suite
        run: ./scripts/ci/runtime-reliability.sh ci

  test-swift:
    name: Test Swift
    runs-on: macos-15
    needs: test-rust
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3 (Swift 6.2)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          swift --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: apps/swift/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install swiftformat (pinned)
        env:
          SWIFTFORMAT_VERSION: "0.60.1"
        run: |
          curl -sL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o /tmp/swiftformat.zip
          unzip -o /tmp/swiftformat.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/swiftformat
          swiftformat --version

      - name: SwiftFormat lint
        run: ./scripts/ci/swiftformat-lint.sh

      - name: Build Rust library
        run: cargo build -p capacitor-core --release

      - name: Run Swift tests
        run: swift test --package-path apps/swift

  build-smoke-test:
    name: Build Smoke Test
    runs-on: macos-15
    needs: [test-rust, test-swift]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3 (Swift 6.2)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          swift --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: apps/swift/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Rust library (release)
        run: cargo build -p capacitor-core --release

      - name: Check UniFFI bindings are fresh
        run: ./scripts/ci/check-uniffi-bindings.sh

      - name: Fix dylib install_name
        run: ./scripts/dev/fix-dylib.sh

      - name: Verify dylib install_name
        run: ./scripts/dev/fix-dylib.sh --verify-only

      - name: Build Swift app (release)
        working-directory: apps/swift
        run: swift build -c release

      - name: Verify version sync
        run: |
          if [ ! -f VERSION ]; then
            echo "ERROR: VERSION file not found"
            exit 1
          fi
          VERSION=$(cat VERSION | tr -d '[:space:]')
          CARGO=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          SWIFT=$(grep -o 'return "[0-9][0-9.a-zA-Z-]*"' apps/swift/Sources/Capacitor/App.swift | tail -1 | sed -E 's/return "(.*)"/\1/')
          echo "VERSION=$VERSION  Cargo=$CARGO  Swift=$SWIFT"
          FAIL=0
          [ "$VERSION" != "$CARGO" ] && echo "MISMATCH: VERSION vs Cargo.toml" && FAIL=1
          [ "$VERSION" != "$SWIFT" ] && echo "MISMATCH: VERSION vs App.swift fallback" && FAIL=1
          [ "$FAIL" = "1" ] && exit 1
          echo "All version surfaces in sync"

      - name: Test bump-version.sh (dry run)
        run: |
          # Save current version
          ORIGINAL=$(cat VERSION)

          # Test patch bump
          ./scripts/release/bump-version.sh patch
          NEW=$(cat VERSION)
          echo "Bumped from $ORIGINAL to $NEW"

          # Restore all files modified by bump-version
          git checkout -- VERSION Cargo.toml apps/swift/Sources/Capacitor/App.swift

  test-worker:
    name: Ingest Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: services/ingest-worker
        run: npm ci

      - name: Run tests
        working-directory: services/ingest-worker
        run: npm test

  build-www:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: apps/www
        run: npm ci

      - name: Build
        working-directory: apps/www
        run: npm run build
