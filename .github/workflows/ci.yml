name: CI

on:
  push:
    branches:
      - main
      - "pkp/**"
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-surface-audit:
    name: Test Surface Audit
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run test surface audit
        run: bash scripts/ci/test-surface-audit.sh --check

  verifier:
    name: Verifier
    runs-on: ubuntu-latest
    needs: test-surface-audit
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Java/Apalache is only needed for higher TLA+ layers (Layer 2+); Layer 1
      # is purely structural (check-structural.py has no java/apalache/tla deps).
      # We skip the Apalache install during bootstrap so this job needs no JVM.
      - name: Bootstrap verifier dependencies
        env:
          VERIFY_SKIP_APALACHE_INSTALL: "1"
        run: ./scripts/verify/verify.sh --bootstrap

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run verifier unit self-tests
        run: .verifier/.venv/bin/python -m unittest discover -s tests/verify/unit -p 'test_*.py'

      - name: Run verifier Bats coverage
        env:
          VENV_DIR: ${{ github.workspace }}/.verifier/.venv
        run: bats tests/verify

      - name: Run formal verification
        run: ./scripts/verify/verify.sh --layers 1 --json

      - name: Upload verifier report artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: formal-verify-report-${{ github.run_id }}
          path: .verifier/reports/last-run.json
          if-no-files-found: warn
          retention-days: 14

  test-scripts:
    name: Test Shell Scripts
    runs-on: macos-14
    needs: test-surface-audit
    steps:
      - uses: actions/checkout@v6

      - name: Install bats
        run: brew install bats-core

      # Agent-drift guardrail: dev-script bats cover restart-*.sh (the agent
      # iteration path), so they run on every PR.
      - name: Run dev script tests
        run: bats tests/dev-scripts

      # Extended (non-per-PR) gate: release-script bats cover release/AX
      # machinery (bump-version, generate-appcast, ax-automation-verify). Gated
      # to manual dispatch / v* tags; skipped on ordinary PRs.
      - name: Run release script tests
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: bats tests/release-scripts

  test-rust:
    name: Test Rust
    runs-on: macos-14
    needs: test-surface-audit
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: ./scripts/ci/select-xcode.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo fmt check
        run: cargo fmt --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings -W dead_code

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        run: cargo machete

      - name: Run Rust tests
        # Test Rust's testable targets without also building exported staticlib/cdylib artifacts.
        # The release artifact path is covered separately by Build Smoke Test.
        run: cargo test --lib --bins --tests

  test-hook:
    name: Test Hook Binary
    runs-on: macos-14
    needs: test-surface-audit
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: ./scripts/ci/select-xcode.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build hud-hook (release)
        run: cargo build -p hud-hook --release

      - name: Install bats
        run: brew install bats-core

      - name: Run hud-hook smoke tests
        run: bats tests/hud-hook/hud-hook-smoke.bats

  runtime-reliability:
    name: Runtime Reliability Gate
    runs-on: macos-15
    needs: test-surface-audit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.3 (Swift 6.2)
        run: ./scripts/ci/select-xcode.sh /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run runtime reliability suite (deterministic gates)
        run: ./scripts/ci/runtime-reliability.sh ci

  ax-automation:
    name: AX Automation (advisory)
    runs-on: macos-15
    needs: test-surface-audit
    # Extended (non-per-PR) gate: the AX GUI lane is user-facing/release-time work
    # and is inherently flaky (UI automation). It only runs on manual dispatch or
    # on v* tags — never on ordinary PRs/branch pushes. Still advisory
    # (continue-on-error) when it does run. Split out of the Runtime Reliability
    # Gate so a flaky AX run can no longer shadow the deterministic
    # projection-parity gate under `set -e`. Builds its own release artifacts via
    # prepare_ax_verifier_build.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.3 (Swift 6.2)
        run: ./scripts/ci/select-xcode.sh /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run AX automation verifier (advisory)
        run: ./scripts/ci/runtime-reliability.sh ax

  test-swift:
    name: Test Swift
    runs-on: macos-15
    needs: test-rust
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.3 (Swift 6.2)
        run: ./scripts/ci/select-xcode.sh /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: apps/swift/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install swiftformat (pinned)
        env:
          SWIFTFORMAT_VERSION: "0.61.1"
        run: |
          # Install into a dedicated dir and reference the binary by ABSOLUTE
          # PATH from here on. The runner image ships its own SwiftFormat in
          # /opt/homebrew/bin, which precedes /usr/local/bin in PATH, so a bare
          # `swiftformat` call resolves to the image's build and silently ignores
          # the one we just installed. That is what the assertion below kept
          # tripping on: the reported version tracked the runner image's
          # SwiftFormat, not our pin, so it moved every time the image did.
          INSTALL_DIR="${RUNNER_TEMP}/swiftformat-${SWIFTFORMAT_VERSION}"
          mkdir -p "${INSTALL_DIR}"
          curl -sL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o "${RUNNER_TEMP}/swiftformat.zip"
          unzip -oq "${RUNNER_TEMP}/swiftformat.zip" -d "${INSTALL_DIR}"
          SWIFTFORMAT_BIN="${INSTALL_DIR}/swiftformat"
          chmod +x "${SWIFTFORMAT_BIN}"

          # Drift-proof: fail fast if the pinned asset does not report the pinned
          # version. Asserting against the absolute path means this now checks
          # the upstream asset itself rather than PATH resolution order.
          INSTALLED_VERSION="$("${SWIFTFORMAT_BIN}" --version)"
          echo "pinned swiftformat: ${SWIFTFORMAT_BIN} (reports ${INSTALLED_VERSION})"
          echo "PATH swiftformat (unused): $(command -v swiftformat || echo none)"
          if [ "${INSTALLED_VERSION}" != "${SWIFTFORMAT_VERSION}" ]; then
            echo "ERROR: expected swiftformat ${SWIFTFORMAT_VERSION} but got ${INSTALLED_VERSION}" >&2
            exit 1
          fi

          # Hand the pinned binary to the lint step below.
          echo "SWIFTFORMAT_BIN=${SWIFTFORMAT_BIN}" >> "${GITHUB_ENV}"

      - name: SwiftFormat lint
        run: ./scripts/ci/swiftformat-lint.sh

      - name: Build Rust library
        run: cargo build -p capacitor-core --release

      # Agent-drift guardrail (NOT release machinery): agents change UniFFI FFI
      # shapes constantly, so the binding-drift check must run on every PR. It
      # only needs the release dylib that the step above just built (it runs
      # uniffi-bindgen against the library), so this is nearly free here. Moved
      # out of the gated release-smoke job to keep it on the per-PR path.
      - name: Check UniFFI bindings are fresh
        run: ./scripts/ci/check-uniffi-bindings.sh

      - name: Run Swift tests
        # Broad run skips the six cross-suite-flaky suites, then each is run in
        # isolation (fresh process) to eliminate MainActor/shared-state leakage.
        # Full coverage preserved. See scripts/ci/swift-test.sh for details.
        run: ./scripts/ci/swift-test.sh

  release-smoke:
    name: Release Smoke Test
    runs-on: macos-15
    needs: [test-rust, test-swift]
    # Extended (non-per-PR) gate: what remains here after relocating the UniFFI
    # drift guard to test-swift is release machinery (release Swift build,
    # version-sync check, bump-version dry-run). It only runs on manual dispatch
    # or on v* tags. Skipped on ordinary PRs/branch pushes (no cost).
    # GitHub treats a skipped `needs:` as satisfied for downstream gated jobs,
    # and no per-PR job needs this one, so the skip is non-blocking.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.3 (Swift 6.2)
        run: ./scripts/ci/select-xcode.sh /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: apps/swift/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Rust library (release)
        run: cargo build -p capacitor-core --release

      # Note: the UniFFI binding-drift check lives in test-swift now (per-PR
      # agent guardrail). The dylib install_name fix/verify below is release
      # machinery — a prerequisite for linking the dylib into the release Swift
      # build, not for binding generation — so it stays in this gated job.
      - name: Fix dylib install_name
        run: ./scripts/dev/fix-dylib.sh

      - name: Verify dylib install_name
        run: ./scripts/dev/fix-dylib.sh --verify-only

      - name: Build Swift app (release)
        working-directory: apps/swift
        run: swift build -c release

      - name: Verify version sync
        run: |
          if [ ! -f VERSION ]; then
            echo "ERROR: VERSION file not found"
            exit 1
          fi
          VERSION=$(cat VERSION | tr -d '[:space:]')
          CARGO=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          SWIFT=$(grep -o 'return "[0-9][0-9.a-zA-Z-]*"' apps/swift/Sources/Capacitor/App.swift | tail -1 | sed -E 's/return "(.*)"/\1/')
          echo "VERSION=$VERSION  Cargo=$CARGO  Swift=$SWIFT"
          FAIL=0
          [ "$VERSION" != "$CARGO" ] && echo "MISMATCH: VERSION vs Cargo.toml" && FAIL=1
          [ "$VERSION" != "$SWIFT" ] && echo "MISMATCH: VERSION vs App.swift fallback" && FAIL=1
          [ "$FAIL" = "1" ] && exit 1
          echo "All version surfaces in sync"

      - name: Test bump-version.sh (dry run)
        run: |
          # Save current version
          ORIGINAL=$(cat VERSION)

          # Test patch bump
          ./scripts/release/bump-version.sh patch
          NEW=$(cat VERSION)
          echo "Bumped from $ORIGINAL to $NEW"

          # Restore all files modified by bump-version
          git checkout -- VERSION Cargo.toml apps/swift/Sources/Capacitor/App.swift

  test-worker:
    name: Ingest Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: services/ingest-worker
        run: npm ci

      - name: Run tests
        working-directory: services/ingest-worker
        run: npm test

  build-www:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: apps/www
        run: npm ci

      - name: Build
        working-directory: apps/www
        run: npm run build
