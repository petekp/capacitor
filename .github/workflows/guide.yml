name: Deploy Literate Guide

on:
  push:
    branches: [main]
    paths:
      - 'apps/www/public/guide/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage guide artifact
        run: |
          mkdir -p dist-guide
          cp -R apps/www/public/guide/. dist-guide/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-guide

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
