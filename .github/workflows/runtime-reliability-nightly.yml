name: Runtime Reliability Nightly

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-reliability-nightly:
    name: Scheduled Runtime Reliability Suite
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run runtime reliability suite
        run: ./scripts/ci/runtime-reliability.sh nightly
