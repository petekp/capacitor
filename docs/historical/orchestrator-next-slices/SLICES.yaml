    touched_paths:
      - docs/plans/orchestrator-next-slices
      - docs/superpowers/specs
      - docs/plans/delegation-loop-validation/CHARTER.md
      - AGENT_CHANGELOG.md
      - UBIQUITOUS_LANGUAGE.md
    external_surfaces: []
    contracts:
      added:
        - "Tracked revised orchestrator spec on the current branch"
      changed:
        - "Authoritative doc read path for orchestrator work"
        - "Legacy `Workstreams` quarantine wording"
      removed:
        - "Stale or misleading local orchestrator doc placeholders"
    denylist_patterns:
      - "file-authoritative orchestration"
    deletion_targets:
      - "Stale docs that imply `Workstreams` is a supported orchestrator dependency"
      - "Empty or misleading local orchestrator spec placeholders"
    temp_artifacts: []
    docs_to_update:
      - docs/plans/orchestrator-next-slices/AGENT_EXECUTION_PLAYBOOK.md
      - docs/plans/orchestrator-next-slices/CHARTER.md
      - docs/plans/orchestrator-next-slices/TRANSLATION_GUIDE.md
      - docs/plans/orchestrator-next-slices/HANDOFF.md
      - docs/plans/orchestrator-next-slices/STARTING_POINT.md
    dependency_changes: []
    residue_queries:
      - pattern: "WorkstreamsManager|WorkstreamsPanel"
        scope: "docs/plans/delegation-loop-validation/CHARTER.md,docs/plans/orchestrator-next-slices"
        reason: "Planning docs should reference Workstreams only as legacy, not as living architecture."
      - pattern: "TODO\\(migration\\)|FIXME\\(migration\\)"
        scope: "docs/plans/orchestrator-next-slices"
        reason: "Foundation slice should not leave placeholder markers."
    verification_commands:
      - command: "bash docs/plans/orchestrator-next-slices/guard.sh"
        expect: "Control-plane docs are present and the baseline verifier/ratchet checks pass."
    replay_scenarios: []
    smoke_scenarios: []
    manual_checks:
      - surface: "Architecture docs"
        check: "Read the revised spec, playbook, and charter back-to-back."
        expected: "All three point to the same architecture target and ownership boundaries."
    risks:
      - "If the revised spec and current slice charter fundamentally conflict, stop and add a decision entry before changing code."
    notes: "Completed on 2026-03-16. Landed the revised orchestrator spec on the current branch, removed the empty stale spec surface, aligned planning docs to the tracked architecture target, and removed the lingering WorkstreamsManager reference from the delegation-loop charter."

  - id: slice-002
    type: implementation
    name: Runtime orchestration core
    status: in_progress
    dependencies:
      - slice-001
    touched_paths:
      - core/capacitor-core/src
      - core/hud-hook/src
      - core/hud-hook/tests
      - core/capacitor-core/tests
      - apps/swift/Sources/Capacitor/Bridge
      - apps/swift/Sources/Capacitor/Models/AppState.swift
      - apps/swift/Sources/Capacitor/Models/RuntimeClient.swift
      - apps/swift/Sources/Capacitor/Utilities
      - apps/swift/Sources/Capacitor/Views/Projects
      - apps/swift/Tests/CapacitorTests/RuntimeClientTests.swift
      - apps/swift/Tests/CapacitorTests/ProjectPrimaryActionResolverTests.swift
      - apps/swift/Tests/CapacitorTests/IdeaQueueStatusResolverTests.swift
      - docs/plans/orchestrator-next-slices
    external_surfaces:
      - GET /runtime/snapshot
      - future orchestration journal persisted by the runtime service
    contracts:
      added:
        - "Explicit orchestrator identity"
        - "Explicit worker identity"
        - "Explicit run identity"
        - "Append-only orchestration event vocabulary"
      changed:
        - "Runtime snapshot shape and Swift decoding"
        - "Runtime-derived project-card and idea-queue orchestration mode read model"
        - "Explicit orchestrator mutation transport over the runtime service"
      removed:
        - "Assumption that the current active delegation record is the final orchestration model"
    denylist_patterns: []
    deletion_targets:
      - "Any long-term assumption that active orchestration is represented only by one `ProjectDelegationState` keyed by project_path"
    temp_artifacts: []
    docs_to_update:
      - docs/plans/orchestrator-next-slices/DECISIONS.md
      - docs/plans/orchestrator-next-slices/TRANSLATION_GUIDE.md
      - docs/plans/orchestrator-next-slices/HANDOFF.md
      - docs/plans/orchestrator-next-slices/MAP.csv
    dependency_changes: []
    residue_queries:
      - pattern: "TODO\\(orchestrator\\)|FIXME\\(orchestrator\\)"
        scope: "core/capacitor-core/src,apps/swift/Sources/Capacitor"
        reason: "The runtime core slice should not leave placeholder orchestration seams."
    verification_commands:
      - command: "cargo test -p capacitor-core --test delegation_contract"
        expect: "Existing delegation-loop contract remains green while the runtime shell expands."
      - command: "cargo test -p capacitor-core"
        expect: "Runtime core and reducer tests remain green after the orchestration model changes."
      - command: "swift test --package-path apps/swift --filter RuntimeClientTests"
        expect: "Swift bridge and runtime decoding stay aligned with the runtime shell."
    replay_scenarios:
      - "Restart runtime after persisting orchestration state and verify the same identities and lifecycle phase reconstruct."
    smoke_scenarios: []
    manual_checks: []
    risks:
      - "This slice can easily overbuild. Keep the shell narrow: one orchestrator, one worker, explicit identity, replay-safe state."
    notes: "In progress as of 2026-03-17. Landed the first additive runtime shell: `ProjectOrchestratorState` as an explicit future-facing snapshot type, a tiny orchestrator mutation seam (`register`, `mark_stale`, `clear`), `ActiveWorkerRunState` driven by current delegation mutations, a typed append-only orchestration event journal in the snapshot, runtime-derived `project_orchestration_views`, and the minimal authenticated runtime-service orchestrator mutation transport. Swift now decodes and consumes the shell/read models, and the runtime service exposes explicit orchestrator mutation requests without choosing automatic registration policy yet."

  - id: slice-003
    type: implementation
    name: Orchestrator registration and reconnect
    status: completed
    dependencies:
      - slice-002
    touched_paths:
      - core/capacitor-core/src
      - core/hud-hook/src
      - core/hud-hook/tests
      - apps/swift/Sources/Capacitor/Models
      - apps/swift/Sources/Capacitor/Utilities
      - apps/swift/Sources/Capacitor/Views/Projects
      - apps/swift/Tests/CapacitorTests
      - docs/plans/orchestrator-next-slices
    external_surfaces:
      - GET /runtime/snapshot
      - minimal orchestrator registration surface
      - local Claude session metadata under ~/.claude/projects/
    contracts:
      added:
        - "Explicit orchestrator registration handshake"
        - "Orchestrator liveness and reconnect read model"
      changed:
        - "Project-card primary routing when orchestrator mode is active"
      removed:
        - "Ad hoc orchestrator identity inference without explicit registration"
    denylist_patterns: []
    deletion_targets:
      - "Any route that guesses orchestrator truth from raw tab/file state without explicit registration"
    temp_artifacts: []
    docs_to_update:
      - docs/plans/orchestrator-next-slices/DECISIONS.md
      - docs/plans/orchestrator-next-slices/TRANSLATION_GUIDE.md
      - docs/plans/orchestrator-next-slices/HANDOFF.md
      - docs/plans/orchestrator-next-slices/MAP.csv
    dependency_changes: []
    residue_queries:
      - pattern: "stale_orchestrator_todo|register_orchestrator_todo"
        scope: "core,apps/swift"
        reason: "Registration and reconnect should not land as TODO-driven architecture."
    verification_commands:
      - command: "cargo test -p capacitor-core"
        expect: "Reducer and runtime registration state remain deterministic."
      - command: "swift test --package-path apps/swift --filter 'RuntimeClientTests|AppStateSessionObservationTests|AppStateTerminalActivationTests|ProjectPrimaryActionResolverTests|TerminalLauncherTests'"
        expect: "Swift registration, stale-marking hysteresis, resume-unavailable fallback, duplicate-attempt guards, and reconnect consumers remain green."
    replay_scenarios:
      - "Open a project with an already-registered orchestrator and verify reconnect without duplicate registration."
    smoke_scenarios:
      - "Project card routes to the active orchestrator instead of launching a duplicate."
    manual_checks:
      - surface: "Project card"
        check: "Reopen a project with a live orchestrator conversation."
        expected: "Capacitor reconnects instead of creating a second orchestrator."
    risks:
      - "Registration may tempt premature MCP breadth. Keep the transport minimal and focused on identity first."
    notes: "Completed on 2026-03-17. The minimal authenticated orchestrator mutation transport now exists over the runtime service, project-card primary action reconnects explicit active/stale orchestrators via `claude --resume <session_id>` when runtime-owned orchestrator identity is present, registration follows the runtime project summary's representative exact root-project session (falling back to runtime latest only if needed), stale-marking now follows fresh exact-session evidence instead of retained-row presence, registered orchestrators hand off to a new runtime representative exact root-project session after two consecutive fresh snapshots, and missing saved Claude conversations now clear unusable Orchestrator registrations before falling back to a fresh Project open plus re-registration. This slice now has both focused test coverage and live proof for registration, reconnect, stale transitions, dead-end recovery, and handoff while the app is already running."

  - id: slice-004
    type: implementation
    name: Re-home the validated delegation loop
    status: in_progress
    dependencies:
      - slice-003
    touched_paths:
      - core/capacitor-core/src
      - core/capacitor-core/tests
      - apps/swift/Sources/Capacitor/Models/DelegationLoopManager.swift
      - apps/swift/Sources/Capacitor/Models/AppState.swift
      - apps/swift/Sources/Capacitor/Models/RuntimeClient.swift
      - apps/swift/Sources/Capacitor/Views/Projects
      - apps/swift/Tests/CapacitorTests
      - docs/plans/orchestrator-next-slices
    external_surfaces:
      - POST /runtime/delegation/mutate or successor orchestration mutation surface
      - managed worktrees under .capacitor/worktrees/
    contracts:
      added:
        - "Delegation-loop user flow expressed through the runtime orchestration shell"
      changed:
        - "Idea -> worker launch path"
        - "Milestone review readiness path"
        - "Decision submission and resume path"
      removed:
        - "Slice-only ownership assumptions replaced by the orchestration core"
    denylist_patterns: []
    deletion_targets:
      - "Bridge-only or transitional state owners that duplicate runtime orchestration truth"
    temp_artifacts: []
    docs_to_update:
      - docs/plans/orchestrator-next-slices/TRANSLATION_GUIDE.md
      - docs/plans/orchestrator-next-slices/HANDOFF.md
      - docs/plans/orchestrator-next-slices/MAP.csv
    dependency_changes: []
    residue_queries:
      - pattern: "legacy_delegation_bridge|temporary_orchestration_bridge"
        scope: "core,apps/swift"
        reason: "The re-home slice must not leave parallel bridge seams alive."
    verification_commands:
      - command: "cargo test -p capacitor-core --test delegation_contract"
        expect: "The validated delegation-loop contract remains green after re-homing."
      - command: "swift test --package-path apps/swift --filter 'DelegationLoopManagerTests|IdeaQueueStatusResolverTests|ProjectPrimaryActionResolverTests|RuntimeClientTests|AppStateTerminalActivationTests'"
        expect: "The existing user loop and the runtime-owned hardening paths remain green through the new control plane."
    replay_scenarios:
      - "Persist review-needed state, restart, then submit the decision and resume the same worker session."
    smoke_scenarios:
      - "Capture one idea, delegate it, review it, and resume it successfully."
    manual_checks:
      - surface: "Delegation review flow"
        check: "Run the current user loop end-to-end."
        expected: "User-visible behavior remains intact while ownership moves under the new runtime shell."
    risks:
      - "This slice can accidentally duplicate control planes if compatibility code lingers."
    notes: "In progress as of 2026-03-17. The runtime-owned orchestration read model now carries `current_review`, `review_context`, and `active_idea_id`, so review-needed cards, project-detail queue state, review detail reads, and review action submission can depend on the orchestration view itself instead of raw delegation payload/state lookups. The hardening follow-up now also proves that stale Orchestrator metadata cannot mask active delegation projection, and missing-conversation recovery quarantines a dead Orchestrator session until runtime `clear` succeeds or disappears while retrying failed clears with surfaced UI feedback. A fresh merge-prep seam audit confirmed the remaining Swift `RuntimeDelegationState` usage is still the runtime snapshot plus `DelegationLoopManager` side-effect reconciliation path rather than a UI split-brain, so it is not the next honest deletion target. Focused `DelegationLoopManagerTests` now also prove the remaining file-driven reconcile transitions from `working` to `review_ready` and `complete`, which tightens merge-prep proof without widening architecture. Merge-prep now also has a persistent external review package under `artifacts/review/orchestrator-runtime-core-2026-03-17/` and a generated zip beside it, so the next move should be reviewer feedback or branch cleanup unless a future slice can name the exact obsolete dependency it will delete."

  - id: slice-005
    type: implementation
