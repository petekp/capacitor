      - core/capacitor-core/tests
      - apps/swift/Sources/Capacitor/Models/DelegationLoopManager.swift
      - apps/swift/Sources/Capacitor/Views/Projects/DelegationReviewView.swift
      - apps/swift/Tests/CapacitorTests
      - docs/plans/orchestrator-next-slices
    external_surfaces:
      - milestone artifact contract
    contracts:
      added:
        - "Revision artifact contract for request-changes loops"
        - "Optional action-suggestion contract with safe fallback"
      changed:
        - "Review iteration flow"
      removed:
        - "Overly terminal request-changes path once revision re-review exists"
    denylist_patterns: []
    deletion_targets:
      - "One-note-to-completion request-changes flow if revision review supersedes it"
    temp_artifacts: []
    docs_to_update:
      - docs/plans/orchestrator-next-slices/TRANSLATION_GUIDE.md
      - docs/plans/orchestrator-next-slices/HANDOFF.md
      - docs/plans/orchestrator-next-slices/MAP.csv
    dependency_changes: []
    residue_queries:
      - pattern: "ack_todo|revision_todo"
        scope: "core,apps/swift"
        reason: "Review iteration should land as a real contract, not placeholder comments."
    verification_commands:
      - command: "cargo test -p capacitor-core"
        expect: "Runtime review-state transitions remain green with revision support."
      - command: "swift test --package-path apps/swift --filter 'DelegationLoopManagerTests|ProjectPrimaryActionResolverTests'"
        expect: "Request-changes revision flow stays deterministic."
    replay_scenarios:
      - "Request changes, publish revision artifacts, and return to review-needed without losing lineage."
    smoke_scenarios:
      - "Review UI shows revision context and supports another decision."
    manual_checks:
      - surface: "Delegation review surface"
        check: "Request changes on a milestone and verify the worker acknowledges and returns with revision context."
        expected: "The user can iterate without restarting the delegation."
    risks:
      - "Generated smart actions should remain optional and must never block rendering the review surface."
    notes: "This slice deepens the human-in-the-loop loop before concurrency is introduced."

  - id: slice-006
    type: implementation
    name: Controlled concurrency
    status: proposed
    dependencies:
      - slice-005
    touched_paths:
      - core/capacitor-core/src
      - core/capacitor-core/tests
      - apps/swift/Sources/Capacitor/Models
      - apps/swift/Sources/Capacitor/Views/Projects
      - apps/swift/Tests/CapacitorTests
      - docs/plans/orchestrator-next-slices
    external_surfaces:
      - project-card active orchestration summaries
    contracts:
      added:
        - "Per-project multi-worker orchestration model"
        - "Concurrency caps and scheduling rules"
      changed:
        - "Project-card activity summaries"
      removed:
        - "Single-active-delegation assumption"
    denylist_patterns: []
    deletion_targets:
      - "Remaining one-active-delegation assumptions in runtime and Swift projection code"
    temp_artifacts: []
    docs_to_update:
      - docs/plans/orchestrator-next-slices/TRANSLATION_GUIDE.md
      - docs/plans/orchestrator-next-slices/HANDOFF.md
      - docs/plans/orchestrator-next-slices/MAP.csv
    dependency_changes: []
    residue_queries:
      - pattern: "single_active_delegation|one_worker_only"
        scope: "core,apps/swift"
        reason: "The concurrency slice should actually remove single-worker assumptions."
    verification_commands:
      - command: "cargo test -p capacitor-core"
        expect: "Reducer and replay tests stay green under multiple active workers."
      - command: "swift test --package-path apps/swift"
        expect: "Swift card-state and review projections stay green when more than one worker exists."
    replay_scenarios:
      - "Persist interleaved worker events and replay them into the same runtime state."
    smoke_scenarios:
      - "A project can show more than one active worker without collapsing into a noisy fleet-management UI."
    manual_checks:
      - surface: "Project card and review routing"
        check: "Observe a project with multiple active workers."
        expected: "The card remains calm and high-signal, surfacing only actionable state."
    risks:
      - "If concurrency degrades the UX into visible agent micromanagement, stop and reopen the product posture decision."
    notes: "This slice comes last because concurrency amplifies every earlier control-plane mistake."
