slices:
  - id: GAS-00
    name: Audit and scaffolding
    status: done
    dependencies: []
    touched_paths:
      - docs/plans/ghostty-applescript/CHARTER.md
      - docs/plans/ghostty-applescript/DECISIONS.md
      - docs/plans/ghostty-applescript/SLICES.yaml
      - docs/plans/ghostty-applescript/MAP.csv
      - docs/audits/ghostty-applescript/AUDIT.md
      - docs/plans/ghostty-applescript/TRANSLATION_GUIDE.md
      - docs/plans/ghostty-applescript/guard.sh
    contracts:
      added:
        - Migration control plane for Ghostty AppleScript migration
      changed: []
      removed: []
    denylist_patterns:
      - GhosttyAXReader
      - bestGhosttyTabMatch
      - ghosttyWindowTitleMatchesSession
      - resolveGhosttyAXRouting
      - activateGhosttyWithAXRouting
    deletion_targets: []
    replay_scenarios: []
    smoke_scenarios: []
    risks:
      - Guard script must ignore the migration folder itself or the denylist patterns will self-match.
    notes:
      - Initial audit counts captured and final guard budgets set to zero after the migration landed.

  - id: GAS-01
    name: Ghostty automation adapter
    status: done
    dependencies: [GAS-00]
    touched_paths:
      - apps/swift/Sources/Capacitor/Models/GhosttyAutomationClient.swift
      - apps/swift/Sources/Capacitor/Models/TerminalLauncher.swift
      - apps/swift/Tests/CapacitorTests/GhosttyAutomationClientTests.swift
    contracts:
      added:
        - GhosttyAutomationClient
        - Ghostty automation snapshot structs
        - TerminalActivationFailureReason
      changed:
        - TerminalActivationResult now carries an optional failure reason
      removed: []
    denylist_patterns:
      - GhosttyAXReader
    deletion_targets: []
    replay_scenarios: []
    smoke_scenarios: []
    risks:
      - Ghostty AppleScript is preview upstream, so the adapter must remain the only script boundary.
    notes:
      - Support probe rejects Ghostty versions older than 1.3 and surfaces Ghostty automation failures explicitly.

  - id: GAS-02
    name: Existing-surface routing migration
    status: done
    dependencies: [GAS-01]
    touched_paths:
      - apps/swift/Sources/Capacitor/Models/TerminalLauncher.swift
      - apps/swift/Sources/Capacitor/Models/GhosttyAutomationClient.swift
      - apps/swift/Tests/CapacitorTests/TerminalLauncherTests.swift
      - apps/swift/Tests/CapacitorTests/GhosttyAutomationClientTests.swift
    contracts:
      added:
        - Ghostty terminal ID cache keyed by tmux client TTY
      changed:
        - Ghostty routing now uses native AppleScript metadata and focus actions
      removed:
        - GhosttyAXReader.swift
        - GhosttyAXReaderTests.swift
        - Ghostty AX title-propagation retry path
    denylist_patterns:
      - GhosttyAXReader
      - bestGhosttyTabMatch
      - ghosttyWindowTitleMatchesSession
      - resolveGhosttyAXRouting
      - activateGhosttyWithAXRouting
    deletion_targets:
      - apps/swift/Sources/Capacitor/Models/GhosttyAXReader.swift
      - apps/swift/Tests/CapacitorTests/GhosttyAXReaderTests.swift
    replay_scenarios: []
    smoke_scenarios: []
    risks:
      - Working directory is a strong signal, but not guaranteed; the cache and title fallbacks remain essential.
    notes:
      - Route priority is cached terminal ID, then working directory, then terminal/tab/window metadata.

  - id: GAS-03
    name: Ghostty launch-path migration
    status: done
    dependencies: [GAS-01]
    touched_paths:
      - apps/swift/Sources/Capacitor/Models/TerminalLauncher.swift
      - apps/swift/Sources/Capacitor/Models/GhosttyAutomationClient.swift
      - apps/swift/Tests/CapacitorTests/TerminalLauncherTests.swift
    contracts:
      added:
        - Evidence that Ghostty native surface creation is not ready for production use on local 1.3.0
      changed:
        - Ghostty launch and resume flows stay on the proven `open` path after live smoke testing the native API
      removed:
        - The planned native Ghostty launch-path migration from the original plan
    denylist_patterns:
      - GhosttyAXReader
    deletion_targets: []
    replay_scenarios: []
    smoke_scenarios: []
    risks:
      - Ghostty launch now depends on native AppleScript availability and explicit failure reporting.
    notes:
      - iTerm and Terminal.app launch paths are unchanged.
      - Historical slice: this launch reversal was later superseded by GAS-05 after the 2026-03-13 live matrix disproved the earlier inert-surface result.

  - id: GAS-04
    name: Cleanup, docs, and ratchet-to-zero
    status: done
    dependencies: [GAS-02, GAS-03]
    touched_paths:
      - README.md
      - .claude/docs/terminal-activation-ux-spec.md
      - .claude/docs/debugging-guide.md
      - .claude/docs/gotchas.md
      - docs/PRE_RELEASE_CHECKLIST.md
      - docs/ARCHITECTURE.md
      - docs/plans/ghostty-applescript/guard.sh
      - docs/plans/ghostty-applescript/HANDOFF.md
    contracts:
      added: []
      changed:
        - Ghostty docs now reference native AppleScript routing and Ghostty 1.3+
      removed:
        - Ghostty AX terminology in current activation docs
    denylist_patterns:
      - GhosttyAXReader
      - bestGhosttyTabMatch
      - ghosttyWindowTitleMatchesSession
      - resolveGhosttyAXRouting
      - activateGhosttyWithAXRouting
    deletion_targets: []
    replay_scenarios: []
    smoke_scenarios:
      - Ghostty multi-window reuse
      - Ghostty no-running-app launch
      - Ghostty unsupported-version / automation-unavailable messaging
    risks:
      - Manual Ghostty QA is still required because the AppleScript API is preview upstream.
    notes:
      - Guard budgets are zero at the end of the migration.

  - id: GAS-05
    name: Native Ghostty launch
    status: done
    dependencies: [GAS-04]
    touched_paths:
      - apps/swift/Sources/Capacitor/Models/TerminalDrivers.swift
      - apps/swift/Sources/Capacitor/Models/GhosttyAutomationClient.swift
      - apps/swift/Tests/CapacitorTests/TerminalLauncherTests.swift
      - apps/swift/Tests/CapacitorTests/GhosttyTerminalDriverTests.swift
      - docs/plans/ghostty-applescript/DECISIONS.md
      - docs/plans/ghostty-applescript/SLICES.yaml
      - docs/plans/ghostty-applescript/MAP.csv
      - docs/plans/ghostty-applescript/HANDOFF.md
      - docs/plans/ghostty-applescript/TRANSLATION_GUIDE.md
      - docs/plans/ghostty-applescript/guard.sh
      - docs/audits/ghostty-applescript/AUDIT.md
      - docs/manual-qa/ghostty-native-surface-matrix-2026-03-13.md
      - AGENT_CHANGELOG.md
    contracts:
      added: []
      changed:
        - Ghostty launch/resume now uses native AppleScript `new window` surface creation with `initial input`
        - Ghostty project-resume scripts stop using `open -a Ghostty.app` and `System Events` keystrokes
      removed:
        - Ghostty-specific open-based launch path
        - Ghostty-specific `System Events` keystroke launch path
    denylist_patterns:
      - GhosttyAXReader
      - open -a Ghostty.app
      - tell process "Ghostty"
    deletion_targets:
      - Ghostty-specific `open -a Ghostty.app` launch snippets
      - Ghostty-specific `System Events` keystroke launch snippets
    replay_scenarios: []
    smoke_scenarios:
      - Ghostty project resume via tmux attach when Ghostty is closed
      - Ghostty project resume via tmux attach when Ghostty is already running
      - Project creation / resume flow through `TerminalScripts.launchWithCommand`
    risks:
      - Cold-start native launch is only proven with `new window`, not `new tab`.
      - Post-create `input text` remains unreliable and must stay out of the shipped path.
    notes:
      - Superseded the prior launch rejection after the 2026-03-13 live matrix proved native surface creation works for the tmux attach/resume cases we ship.
      - Completed with regression coverage, restored legacy-launch ratchets, and a post-implementation live tmux-attach smoke for both cold-start and running-app `new window` flows.
