<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capacitor Runtime Explorer</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; margin: 24px; background: #0b1020; color: #e6e9f2; }
    h1 { margin: 0 0 8px; }
    p { color: #aeb6cc; }
    .row { display: flex; gap: 12px; margin: 12px 0 20px; flex-wrap: wrap; }
    button { background: #1f2a4a; color: #e6e9f2; border: 1px solid #334166; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .card { background: #111933; border: 1px solid #27335a; border-radius: 10px; padding: 12px; }
    .label { color: #8ea0d3; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
    .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
    pre { background: #0c1530; border: 1px solid #27335a; border-radius: 10px; padding: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Capacitor Runtime Explorer</h1>
  <p>Live view of runtime snapshot + telemetry endpoints from <code>scripts/transparent-ui-server.mjs</code>.</p>

  <div class="row">
    <button id="refresh">Refresh</button>
    <button id="toggle">Start Auto Refresh</button>
  </div>

  <section class="grid" id="summary"></section>

  <h2>Runtime Snapshot</h2>
  <pre id="snapshot">Loading...</pre>

  <h2>Agent Briefing</h2>
  <pre id="briefing">Loading...</pre>

  <script>
    const summaryEl = document.getElementById('summary');
    const snapshotEl = document.getElementById('snapshot');
    const briefingEl = document.getElementById('briefing');
    const refreshBtn = document.getElementById('refresh');
    const toggleBtn = document.getElementById('toggle');

    let interval = null;

    function card(label, value) {
      return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`;
    }

    async function load() {
      const [runtimeRes, briefingRes] = await Promise.all([
        fetch('/runtime-snapshot'),
        fetch('/agent-briefing?limit=100')
      ]);

      const runtime = await runtimeRes.json();
      const briefing = await briefingRes.json();

      if (!runtime.ok) {
        summaryEl.innerHTML = card('Status', 'Unavailable');
        snapshotEl.textContent = JSON.stringify(runtime, null, 2);
        briefingEl.textContent = JSON.stringify(briefing, null, 2);
        return;
      }

      const sessions = Array.isArray(runtime.sessions) ? runtime.sessions.length : 0;
      const projects = Array.isArray(runtime.project_states) ? runtime.project_states.length : 0;
      const shells = runtime.shell_state?.total_count ?? 0;
      const routingStatus = runtime.routing?.snapshot?.status ?? 'unknown';

      summaryEl.innerHTML = [
        card('Sessions', sessions),
        card('Projects', projects),
        card('Shells', shells),
        card('Routing Status', routingStatus)
      ].join('');

      snapshotEl.textContent = JSON.stringify(runtime, null, 2);
      briefingEl.textContent = JSON.stringify(briefing, null, 2);
    }

    refreshBtn.addEventListener('click', () => load().catch(err => { snapshotEl.textContent = String(err); }));

    toggleBtn.addEventListener('click', () => {
      if (interval) {
        clearInterval(interval);
        interval = null;
        toggleBtn.textContent = 'Start Auto Refresh';
      } else {
        interval = setInterval(() => load().catch(() => {}), 2000);
        toggleBtn.textContent = 'Stop Auto Refresh';
      }
    });

    load().catch(err => {
      snapshotEl.textContent = String(err);
      briefingEl.textContent = String(err);
    });
  </script>
</body>
</html>
